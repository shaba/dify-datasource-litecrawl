[project]
name = "dify-datasource-litecrawl"
version = "0.1.1"
description = "Crawl static documentation sites and wikis into clean per-page markdown"
readme = "README.md"
requires-python = ">=3.12"

dependencies = [
    "dify_plugin>=0.9.0",
    "trafilatura>=2.0",
    "requests>=2.32",
    "lxml>=5.0",
    "beautifulsoup4>=4.12",
    "markdownify>=0.13",]

[dependency-groups]
dev = []
