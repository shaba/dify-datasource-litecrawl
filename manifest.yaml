version: 0.1.3
type: plugin
author: shaba
name: litecrawl
repo: https://github.com/shaba/dify-datasource-litecrawl
label:
  en_US: Litecrawl
  ru_RU: Litecrawl
description:
  en_US: "Crawl static documentation sites and wikis (VitePress, MkDocs, Docusaurus, Sphinx, MediaWiki, ...) into clean per-page markdown."
  ru_RU: "Краулер статических докосайтов и вики (VitePress, MkDocs, Docusaurus, Sphinx, MediaWiki, ...) в чистый markdown по страницам."
icon: icon.svg
tags:
  - rag
resource:
  memory: 268435456
  permission:
    model:
      enabled: false
    node:
      enabled: false
plugins:
  datasources:
    - provider/docs.yaml
meta:
  version: 0.1.1
  arch:
    - amd64
    - arm64
  runner:
    language: python
    version: "3.12"
    entrypoint: main
  minimum_dify_version: 1.9.0
created_at: "2026-06-05T00:00:00Z"
